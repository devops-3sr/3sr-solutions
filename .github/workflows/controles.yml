name: Controles

# Controles automatiques du depot public : secrets, qualite PowerShell, tests unitaires,
# regles de publication. Ils s'executent sur chaque pull request et sur main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer gitleaks (version epinglee, empreinte verifiee)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Analyser tout l'historique
        run: ./gitleaks git --redact --verbose --no-banner .

      - name: Analyser l'arbre de fichiers
        run: ./gitleaks dir --redact --verbose --no-banner .

  analyse:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyser les scripts PowerShell
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $resultats = Invoke-ScriptAnalyzer -Path ssl-managed -Recurse -Settings .github/PSScriptAnalyzerSettings.psd1
          foreach ($r in $resultats) {
            $niveau = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Host ("::{0} file={1},line={2}::{3} - {4}" -f $niveau, $r.ScriptPath.Replace($PWD.Path + '\', '').Replace('\', '/'), $r.Line, $r.RuleName, $r.Message)
          }
          $erreurs = @($resultats | Where-Object Severity -eq 'Error')
          Write-Host ("{0} erreur(s), {1} avertissement(s)" -f $erreurs.Count, ($resultats.Count - $erreurs.Count))
          if ($erreurs.Count -gt 0) { exit 1 }

  tests:
    name: Pester (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Executer les tests Pester 5
        shell: ${{ matrix.shell }}
        run: |
          Install-Module Pester -RequiredVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'ssl-managed/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  depot:
    name: Regles du depot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verifier les regles de publication
        shell: pwsh
        run: ./.github/scripts/controle-depot.ps1
